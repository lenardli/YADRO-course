---

- name: Check if swap is enabled
  command: swapon --show
  register: swap_status
  changed_when: false
  become: true

- name: Disable swap immediately (if enabled)
  command: swapoff -a
  become: true
  when: swap_status.stdout_lines | length > 0
  changed_when: true
  
- name: Remove swap from fstab
  mount:
    name: swap
    fstype: swap
    state: absent
  become: true
  ignore_errors: yes

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Add Kubernetes GPG key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key | \
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"
    state: present
    filename: kubernetes.list
    update_cache: true
  become: true


- name: Install kubelet
  apt:
    name: kubelet
    state: present
    update_cache: false
  become: true
  register: kubelet_install
  until: kubelet_install is success
  retries: 6
  delay: 20

- name: Enable and start kubelet service
  systemd:
    name: kubelet
    enabled: yes
    state: started
    daemon_reload: yes
  become: true

- name: Hold kubelet package
  dpkg_selections:
    name: kubelet
    selection: hold
  become: true