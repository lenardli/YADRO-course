---

- name: Gather swap fact
  ansible.builtin.setup:
    gather_subset:
      - min
    filter:
      - ansible_swaptotal_mb

- name: Disable swap immediately (if enabled)
  ansible.builtin.command: swapoff -a
  become: true
  when: (ansible_swaptotal_mb | default(0) | int) > 0
  changed_when: true
  
- name: Remove swap from fstab
  ansible.builtin.mount:
    name: swap
    fstype: swap
    state: absent
  become: true
  when: (ansible_swaptotal_mb | default(0) | int) > 0
  ignore_errors: yes

- name: Collect installed packages
  ansible.builtin.package_facts:
    manager: auto
  become: true

- name: Install kubelet when absent
  when: "'kubelet' not in ansible_facts.packages"
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      become: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: true

    - name: Download and add Kubernetes GPG key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: '0644'
        owner: root
        group: root
      become: true
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"
        state: present
        filename: kubernetes.list
        update_cache: true
      become: true

    - name: Install kubelet
      ansible.builtin.apt:
        name: kubelet
        state: present
        update_cache: false
      become: true
      register: kubelet_install
      until: kubelet_install is success
      retries: 6
      delay: 20

- name: Enable and start kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes
    state: started
    daemon_reload: yes
  become: true

- name: Hold kubelet package
  ansible.builtin.dpkg_selections:
    name: kubelet
    selection: hold
  become: true