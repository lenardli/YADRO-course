# Значения для чарта ingress-nginx/ingress-nginx (репозиторий kubernetes.github.io/ingress-nginx).
# Контроллер: DaemonSet на каждой подходящей ноде, сеть процесса = сеть хоста (прямой вход на порты контроллера, например 80).
#
# Перед установкой:
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx && helm repo update
#
# Установка или обновление:
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     -n ingress-nginx --create-namespace \
#     -f k8s/ingress-nginx-hostnetwork-values.yaml
#
# Версия чарта может менять ключи — при ошибке сверяйте с README чарта.
controller:
  kind: DaemonSet
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  # Внешний вход идёт с IP ноды на порты Pod (80/443), отдельный NodePort часто не нужен.
  service:
    type: ClusterIP
