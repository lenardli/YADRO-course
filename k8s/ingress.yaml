apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yadro-currency-api
  labels:
    app: yadro-currency-api
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yadro-currency-api
                port:
                  number: 80
